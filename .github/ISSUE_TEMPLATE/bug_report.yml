name: Bug report
description: Something in EnManga doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill in what you can. If the app showed an error screen, the details are in `ux0:data/enmanga/log.txt`; attaching that file helps a lot.
  - type: input
    id: version
    attributes:
      label: EnManga version
      description: Shown in Settings → About
      placeholder: Beta 1.0
    validations:
      required: true
  - type: dropdown
    id: console
    attributes:
      label: Console
      options:
        - PS Vita 1000 (OLED)
        - PS Vita 2000 (slim)
        - PS TV
        - Not sure
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware and exploit
      placeholder: 3.65 Ensō
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the library
        2. Hold the Vita in portrait
        3. ...
  - type: textarea
    id: files
    attributes:
      label: The file or folder involved (if any)
      description: Its name and layout, e.g. `ux0:manga/Series/Vol 01.cbz`, and whether it's a CBZ/ZIP or a folder of images. Please don't upload copyrighted manga.
  - type: textarea
    id: log
    attributes:
      label: log.txt
      description: Paste the contents of `ux0:data/enmanga/log.txt`, or drag the file here
      render: text
